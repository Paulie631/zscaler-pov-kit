name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Offline tests
        run: uv run --with pytest --with requests --with keyring --with cryptography pytest -q
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uvx ruff check .
