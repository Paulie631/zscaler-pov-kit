name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Offline tests
        run: uv run --with pytest --with requests --with keyring --with cryptography pytest -q
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uvx ruff check .
      - name: Plugin and release files
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run --no-project python tools/build_plugin.py --check
          uv run --no-project python tools/package.py --check
          uv run --no-project python tools/build_guide.py --check
