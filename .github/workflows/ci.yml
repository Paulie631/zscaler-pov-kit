name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Offline tests
        run: uv run --with pytest --with requests --with keyring --with cryptography --with python-docx --with python-pptx pytest -q
      - name: One-line installers parse
        shell: bash
        run: |
          bash -n install.sh
          bash -n povkit/zcc-setup.sh
          for f in povkit/cloudshare/*.sh; do bash -n "$f"; done
          pwsh -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("povkit/cloudshare/zpov-pilot-prepare.ps1",[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
          pwsh -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("povkit/zcc-setup.ps1",[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
          pwsh -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1",[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
      - name: Lint
        if: matrix.os == 'ubuntu-24.04'
        run: uvx ruff check .
      - name: Plugin and release files
        if: matrix.os == 'ubuntu-24.04'
        run: |
          uv run --no-project python tools/build_plugin.py --check
          uv run --no-project python tools/package.py --check
          uv run --no-project python tools/build_guide.py --check
